global
  log         127.0.0.1 local2
  pidfile     /var/run/haproxy.pid
  maxconn     4000
  stats socket /var/lib/haproxy/stats
  daemon
defaults
  mode                    http
  log                     global
  option                  dontlognull
  option http-server-close
  option                  redispatch
  retries                 3
  timeout http-request    10s
  timeout queue           1m
  timeout connect         10s
  timeout client          1m
  timeout server          1m
  timeout http-keep-alive 10s
  timeout check           10s
  maxconn                 3000

listen api-server-6443
  bind *:6443
  mode tcp
  option  httpchk GET /readyz HTTP/1.0
  option  log-health-checks
  balance roundrobin
{% if deploy_bootstrap %}
  server bootstrap {{ network_prefix }}.9:6443 verify none check check-ssl inter 10s fall 2 rise 3 backup
{% endif %}
{% for controlplane in range(0,controlplanes) %}
  server controlplane-{{ controlplane }} {{ network_prefix }}.{{ controlplane+10 }}:6443 weight 1 verify none check check-ssl inter 10s fall 2 rise 3
{% endfor %}

listen machine-config-server-22623
  bind *:22623
  mode tcp
{% if deploy_bootstrap %}
  server bootstrap {{ network_prefix }}.9:22623 check inter 1s backup
{% endif %}
{% for controlplane in range(0,controlplanes) %}
  server controlplane-{{ controlplane }} {{ network_prefix }}.{{ controlplane+10 }}:22623 weight 1 verify none check check-ssl inter 10s fall 2 rise 3
{% endfor %}

listen ingress-router-443
  bind *:443
  mode tcp
  balance source
{% for controlplane in range(0,controlplanes) %}
  server controlplane-{{ controlplane }} {{ network_prefix }}.{{ controlplane+10 }}:443 weight 1 verify none check check-ssl inter 10s fall 2 rise 3
{% endfor %}
{% for worker in range(0,workers) %}
  server worker-{{ worker }} {{ network_prefix }}.{{ worker+20 }}:443 weight 1 verify none check check-ssl inter 10s fall 2 rise 3
{% endfor %}

listen ingress-router-80
  bind *:80
  mode tcp
  balance source
{% for controlplane in range(0,controlplanes) %}
  server controlplane-{{ controlplane }} {{ network_prefix }}.{{ controlplane+10 }}:80 weight 1 verify none check check-ssl inter 10s fall 2 rise 3
{% endfor %}
{% for worker in range(0,workers) %}
  server worker-{{ worker }} {{ network_prefix }}.{{ worker+20 }}:80 weight 1 verify none check check-ssl inter 10s fall 2 rise 3
{% endfor %}




