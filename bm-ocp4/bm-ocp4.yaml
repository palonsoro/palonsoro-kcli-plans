parameters:
  deploy_bootstrap: false
  deploy_lb: false
  lb_cpus: 2
  lb_ram: 4096
  lb_disk: 10
  cluster_name: 'default-cluster-name'
  control_plane_cpus: 4
  control_plane_ram: 16384
  control_plane_disk: 30
  control_plane_second_disk: 50
  controlplanes: 3
  workers: 2
  worker_cpus: 2
  worker_ram: 8192
  worker_disk: 30
  worker_second_disk: 50
  network: default
  network_prefix: 192.168.0 # I'll be assuming a /24 where masters have IPs .10, .11 and .12, workers will have .(20+n) IPs and the other ones are reserved.
  api_vip: 192.168.0.2 # For apps wildcard, see companion script for libvirt
  mac_prefix: aa:aa:aa:aa:05

{{ cluster_name }}-controlplane:
  type: profile
  uefi: true
  start: false
  user: core
  numcpus: {{ control_plane_cpus }}
  memory: {{ control_plane_ram }}
  disks:
  - {{ control_plane_disk }}
  - {{ control_plane_second_disk }}

{{ cluster_name }}-lb:
  type: profile
  image: centos10stream
  start: false
  numcpus: {{ lb_cpus }}
  memory: {{ lb_ram }}
  disks:
  - {{ lb_disk }}
  files:
  - path: /etc/haproxy/haproxy.cfg
    origin: lb/haproxy.cfg
  scripts:
  - lb/install-haproxy.sh

{{ cluster_name }}-worker:
  type: profile
  uefi: true
  start: false
  user: core
  numcpus: {{ worker_cpus }}
  memory: {{ worker_ram }}
  disks:
  - {{ worker_disk }}
  - {{ worker_second_disk }}

{% for controlplane in range(0,controlplanes) %}
{{ cluster_name }}-controlplane-{{ controlplane }}:
  profile:  {{ cluster_name }}-controlplane
  nets: 
  - name: {{ network }}
    ip: {{ network_prefix }}.{{ controlplane+10 }}
    mac: {{ mac_prefix }}:{{ "%0x"|format(controlplane+10) }}

{{ cluster_name }}-controlplane-{{ controlplane }}:
  type: dns
  net: {{ network }}
  ip: {{ network_prefix }}.{{ controlplane+10 }}
{% endfor %}

{% if deploy_bootstrap %}
{{ cluster_name }}-bootstrap:
  profile:  {{ cluster_name }}-controlplane
  nets: 
  - name: {{ network }}
    ip: {{ network_prefix }}.9
    mac: {{ mac_prefix }}:{{ "%0x"|format(9) }}

{{ cluster_name }}-bootstrap:
  type: dns
  net: {{ network }}
  ip: {{ network_prefix }}.9
{% endif %}

{% for worker in range(0,workers) %}
{{ cluster_name }}-worker-{{ worker }}:
  profile:  {{ cluster_name }}-worker
  nets: 
  - name: {{ network }}
    ip: {{ network_prefix }}.{{ worker+20 }}
    mac: {{ mac_prefix }}:{{ "%0x"|format(worker+20) }}

{{ cluster_name }}-worker-{{ worker }}:
  type: dns
  net: {{ network }}
  ip: {{ network_prefix }}.{{ worker+20 }}
{% endfor %}

{% if deploy_lb %}
{{ cluster_name }}-lb:
  profile:  {{ cluster_name }}-lb
  nets: 
  - name: {{ network }}
    ip: {{ api_vip }}
    mac: {{ mac_prefix }}:{{ "%0x"|format(19) }}
{% endif %}

api:
  type: dns
  net: {{ network }}
  ip: {{ api_vip }}

api-int:
  type: dns
  net: {{ network }}
  ip: {{ api_vip }}
